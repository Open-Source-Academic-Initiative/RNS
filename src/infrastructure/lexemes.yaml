# IT Lexeme Matrix V2.4 — edit this file to tune semantic filtering.
#
# categories:         regex fragments grouped by domain (joined with `|` to build the pattern).
# socrata_like_seeds: broad substrings pushed to Socrata `$where` as an OR chain of
#                     `UPPER(nombre|descripción) LIKE '%SEED%'` clauses to reduce
#                     payload size. Keep the list intentionally broad enough not to
#                     drop known true positives; the regex post-filter remains
#                     authoritative for precision.

